<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!--  SEO 基本信息 -->
    <meta
      name="description"
      content="旅迹 · Lifelong Journey —— 一款基于地图打卡与日志记录的可视化应用，让你用足迹记录人生旅程。"
    />
    <meta
      name="keywords"
      content="旅迹, Lifelong Journey, 地图打卡, 日志记录, React, 地理可视化, ECharts"
    />
    <meta name="robots" content="index, follow" />

    <!--  移动端视口 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--  网站图标 -->
    <link rel="icon" type="image/x-icon" href="/icon.ico" />

    <!-- 关键域名 DNS 预解析 + 连接预热（首屏地图、后端 API） -->
    <link rel="dns-prefetch" href="//webapi.amap.com" />
    <link rel="dns-prefetch" href="//restapi.amap.com" />
    <link rel="preconnect" href="https://webapi.amap.com" crossorigin />
    <link rel="preconnect" href="https://restapi.amap.com" crossorigin />
    <link rel="preconnect" href="http://localhost:3001" />

    <!-- LCP 图预加载：HTML 解析阶段就开始下载，比 JS import 早 ~500ms -->
    <link rel="preload" as="image" href="/bg1.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/bg2.webp" type="image/webp" />

    <!--  页面标题 -->
    <title>旅迹 · Lifelong Journey</title>

    <!--  社交分享卡片（Open Graph） -->
    <meta property="og:title" content="旅迹 · Lifelong Journey" />
    <meta
      property="og:description"
      content="记录你的足迹与故事，在世界地图上可视化人生旅程。"
    />
    <meta property="og:image" content="/assets/cover.webp" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>

    <!--  应用入口 -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
